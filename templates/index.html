<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>FlyingToDo</title>
     <link rel="stylesheet" href="../css/style.css">
     <script src="../script/script.js" defer></script>

     <link rel="preconnect" href="https://fonts.googleapis.com"> 
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

     <link rel="icon" href="../img/icons8-check-mark-48.png">

</head>
<body>
     <nav>
          <img class="logo" src="../img/flyingtodologo.png">
          <p class="buttonadd" id="uploadbutton">+</p>
          <p class="settingsbtn" id="settingsbtn">🔧</p>
          <p class="createtagbtn" id="createtagbtn">#</p>
     </nav>

     <div class="containercreatetags" id="crtagcont">
          <input class="inputcreatetags" id="inputtags" placeholder="Créez votre tag!">
          <div class="containertagslist" id="containertags"></div>
     </div>
     
     <section>
          <h1>Welcome on FlyingToDo !</h1>
          <div class="containerx" id="pretodo">
          </div>

          <div class="containertodo">
          </div>
     </section> 
     <section class="settings">
          <p class="retour"> < Retour</p>
          <h1>Select your own colors:</h1>
          <div>
               <label for="maincolorpick">Main Color - </label>
               <input type="color" name="maincolorpick" class="maincolorpick"> 
          </div>
          <div>
               <label for="seccolorpick">Secondary Color - </label>         
               <input type="color" name="seccolorpick" class="seccolorpick">
          </div>
          <button class="resetclr">Reset Colors</button>
          
          <h1>Reset todos:</h1>
          <p class="buttonreset" id="resetbtn">Reset</p>
     </section>

     
</body>
</html>
